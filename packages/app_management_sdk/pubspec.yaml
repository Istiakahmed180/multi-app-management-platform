name: app_management_sdk
description: >-
  Pure-Dart client for the App Management Platform: remote configuration,
  theming, feature flags with percentage rollouts, update policy, maintenance
  mode and banners, with ETag caching and an offline last-known-good fallback.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.8.0

dependencies:
  dio: ^5.11.1
dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0
