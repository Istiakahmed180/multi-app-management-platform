# Serves the Flutter web build and proxies /api to the backend so the dashboard and
# API share one origin (SameSite=Strict cookies, no cross-origin CORS needed).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  client_max_body_size 1m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # Flutter web (CanvasKit) needs wasm-unsafe-eval; fonts/CanvasKit are served locally by default.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https://www.gstatic.com https://fonts.gstatic.com; frame-ancestors 'none'; base-uri 'self'" always;

  location /api/ {
    proxy_pass ${API_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
