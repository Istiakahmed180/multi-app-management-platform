# Local development stack: MongoDB, API, dashboard (nginx) and optional MinIO.
#   cp infra/.env.example infra/.env   # then fill in ENCRYPTION_KEY
#   docker compose -f infra/docker-compose.yml --env-file infra/.env up --build
#   docker compose -f infra/docker-compose.yml --profile storage up   # with MinIO
name: app-management-platform

services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ../backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/app_management
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in infra/.env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      DASHBOARD_URL: ${DASHBOARD_URL:-http://localhost:8080}
      # Behind the dashboard's nginx proxy.
      TRUST_PROXY: 1
      # Plain-http local stack; must be true (default) when served over https.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SYNC_INDEXES_ON_START: "true"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
    ports:
      - "127.0.0.1:4000:4000"

  dashboard:
    build:
      context: ../dashboard
      args:
        API_BASE_URL: /api/v1
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      API_UPSTREAM: http://backend:4000
    ports:
      - "127.0.0.1:8080:80"

  minio:
    image: minio/minio:latest
    profiles: ["storage"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}  # set in infra/.env (8+ chars) when using --profile storage
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

volumes:
  mongo-data:
  minio-data:
